<!doctype html>
<html lang="hu" data-theme="light">
    <head>
        <script>
            (function () {
                var o = Storage.prototype.removeItem;
                Storage.prototype.removeItem = function (k) {
                    if (k === "base44_access_token") {
                        try {
                            var t = this.getItem(k);
                            t &&
                                (document.cookie =
                                    "base44_sign_out_token=" +
                                    encodeURIComponent(t) +
                                    ";path=/api/apps/auth/logout;max-age=60" +
                                    (location.protocol !== "https:"
                                        ? ";SameSite=Strict"
                                        : window.top !== window.self
                                          ? ";SameSite=None;Secure;Partitioned"
                                          : ";SameSite=Strict;Secure"));
                        } catch (e) {}
                    }
                    return o.call(this, k);
                };
            })();
        </script>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
        <title>Ismerkedési Tréner – önálló verzió</title>
        <meta
            content="Tét nélküli gyakorlótér a megszólításhoz: 5 próbálkozás, utána 24 óra szünet. Egyetlen fájl, internet nélkül is fut."
            name="description"
        />
        <meta content="#f8f7fd" name="theme-color" />
        <style>
            :root {
                --background: 250 45% 98%;
                --foreground: 248 30% 14%;
                --card: 0 0% 100%;
                --primary: 251 71% 61%;
                --primary-foreground: 0 0% 100%;
                --muted-foreground: 248 12% 46%;
                --accent: 264 78% 96%;
                --accent-foreground: 258 45% 30%;
                --border: 250 26% 90%;
                --radius: 1.35rem;
                --shadow: 0 18px 50px -30px hsl(var(--primary) / 0.55);
            }

            [data-theme="dark"] {
                --background: 249 30% 8%;
                --foreground: 250 30% 96%;
                --card: 249 26% 12%;
                --primary: 252 82% 71%;
                --primary-foreground: 250 45% 10%;
                --muted-foreground: 249 14% 68%;
                --accent: 255 30% 20%;
                --accent-foreground: 250 40% 92%;
                --border: 249 20% 21%;
                --shadow: 0 18px 50px -30px hsl(var(--primary) / 0.5);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                font-family:
                    "Plus Jakarta Sans",
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                color: hsl(var(--foreground));
                background-color: hsl(var(--background));
                background-image: radial-gradient(120% 70% at 50% -15%, hsl(var(--primary) / 0.13), transparent 65%),
                    radial-gradient(90% 60% at 110% 105%, hsl(216 90% 60% / 0.1), transparent 60%);
                background-attachment: fixed;
                -webkit-font-smoothing: antialiased;
                line-height: 1.5;
            }

            h1,
            h2,
            h3,
            p,
            ul {
                margin: 0;
                padding: 0;
            }

            button,
            input,
            textarea {
                font: inherit;
                color: inherit;
            }

            button {
                cursor: pointer;
                border: 0;
                background: none;
            }

            ::selection {
                background: hsl(var(--primary) / 0.22);
            }

            .wrap {
                width: 100%;
                max-width: 36rem;
                margin: 0 auto;
                padding: 2rem 1.25rem 4rem;
            }

            .center {
                text-align: center;
            }

            .theme-toggle {
                position: fixed;
                top: 1rem;
                right: 1rem;
                z-index: 40;
                display: grid;
                place-items: center;
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 999px;
                border: 1px solid hsl(var(--border));
                background: hsl(var(--card) / 0.85);
                color: hsl(var(--muted-foreground));
                backdrop-filter: blur(10px);
                transition:
                    color 0.2s,
                    border-color 0.2s,
                    transform 0.2s;
            }

            .theme-toggle:hover {
                color: hsl(var(--primary));
                border-color: hsl(var(--primary) / 0.4);
            }

            .theme-toggle:active {
                transform: scale(0.94);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 2rem;
                padding-right: 3.5rem;
            }

            .brand-badge {
                display: grid;
                place-items: center;
                width: 2.5rem;
                height: 2.5rem;
                flex: 0 0 auto;
                border-radius: 1rem;
                background: hsl(var(--primary));
                color: hsl(var(--primary-foreground));
                box-shadow: 0 1px 2px rgba(20, 15, 40, 0.15);
            }

            .brand-title {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 0.95rem;
                font-weight: 600;
                letter-spacing: -0.01em;
                line-height: 1.2;
            }

            .brand-sub {
                margin-top: 0.2rem;
                font-size: 0.68rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: hsl(var(--muted-foreground));
            }

            .avatar-stage {
                position: relative;
                display: flex;
                justify-content: center;
                margin-bottom: 2rem;
            }

            .avatar-glow {
                position: absolute;
                bottom: 1rem;
                width: 11rem;
                height: 8rem;
                border-radius: 999px;
                background: hsl(var(--primary) / 0.2);
                filter: blur(46px);
                animation: breathe 4.5s ease-in-out infinite;
            }

            .avatar {
                position: relative;
                animation: float 6s ease-in-out infinite;
                max-width: 100%;
                height: auto;
            }

            .title {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 1.75rem;
                font-weight: 600;
                line-height: 1.15;
                letter-spacing: -0.02em;
            }

            @media (min-width: 640px) {
                .title {
                    font-size: 2rem;
                }
            }

            .lead {
                margin-top: 0.5rem;
                font-size: 0.95rem;
                color: hsl(var(--muted-foreground));
            }

            .skills {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
                margin-top: 1.25rem;
            }

            .skill {
                padding: 0.65rem 0.5rem;
                border: 1px solid hsl(var(--border));
                border-radius: 1rem;
                background: hsl(var(--card) / 0.5);
                font-size: 0.7rem;
                font-weight: 500;
                text-align: center;
                color: hsl(var(--muted-foreground));
            }

            .card {
                margin-top: 1rem;
                padding: 1.25rem;
                border: 1px solid hsl(var(--border));
                border-radius: 1.5rem;
                background: hsl(var(--card) / 0.85);
                box-shadow: var(--shadow);
                backdrop-filter: blur(10px);
            }

            @media (min-width: 640px) {
                .card {
                    padding: 1.5rem;
                }
            }

            .card > * + * {
                margin-top: 1.5rem;
            }

            .field-label {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 0.75rem;
                margin-bottom: 0.5rem;
            }

            .field-label p:first-child {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 0.875rem;
                font-weight: 600;
            }

            .field-hint {
                font-size: 0.7rem;
                color: hsl(var(--muted-foreground));
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .chip {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.5rem 0.875rem;
                border-radius: 999px;
                border: 1px solid hsl(var(--border));
                background: hsl(var(--card) / 0.6);
                font-size: 0.8125rem;
                font-weight: 500;
                color: hsl(var(--muted-foreground));
                transition:
                    border-color 0.18s,
                    color 0.18s,
                    background 0.18s,
                    transform 0.12s;
            }

            .chip:hover {
                border-color: hsl(var(--primary) / 0.3);
                color: hsl(var(--foreground));
            }

            .chip:active {
                transform: scale(0.97);
            }

            .chip--on {
                border-color: hsl(var(--primary) / 0.4);
                background: hsl(var(--primary) / 0.12);
                color: hsl(var(--primary));
            }

            .chip svg {
                flex: 0 0 auto;
            }

            .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            input[type="text"],
            textarea {
                width: 100%;
                padding: 0.7rem 0.875rem;
                border: 1px solid hsl(var(--border));
                border-radius: 1rem;
                background: hsl(var(--background));
                font-size: 0.95rem;
                outline: none;
                transition:
                    border-color 0.18s,
                    box-shadow 0.18s;
            }

            input[type="text"] {
                height: 2.75rem;
            }

            textarea {
                min-height: 5rem;
                resize: none;
                line-height: 1.5;
            }

            input::placeholder,
            textarea::placeholder {
                color: hsl(var(--muted-foreground) / 0.7);
            }

            input[type="text"]:focus,
            textarea:focus {
                border-color: hsl(var(--primary) / 0.5);
                box-shadow: 0 0 0 4px hsl(var(--primary) / 0.1);
            }

            .custom-field {
                margin-top: 0.5rem;
            }

            .custom-meta {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 0.75rem;
                margin-top: 0.4rem;
            }

            .custom-meta p {
                font-size: 0.7rem;
                line-height: 1.4;
                color: hsl(var(--muted-foreground));
            }

            .custom-meta span {
                flex: 0 0 auto;
                font-size: 0.7rem;
                font-variant-numeric: tabular-nums;
                color: hsl(var(--muted-foreground));
            }

            .hint-line {
                margin-top: 0.5rem;
                font-size: 0.7rem;
                color: hsl(var(--muted-foreground));
            }

            .primary-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                width: 100%;
                height: 3.5rem;
                border-radius: 1rem;
                background: hsl(var(--primary));
                color: hsl(var(--primary-foreground));
                font-size: 0.95rem;
                font-weight: 600;
                box-shadow: 0 16px 36px -16px hsl(var(--primary) / 0.9);
                transition:
                    filter 0.18s,
                    transform 0.12s,
                    opacity 0.18s;
            }

            .primary-btn:hover:not(:disabled) {
                filter: brightness(1.05);
            }

            .primary-btn:active:not(:disabled) {
                transform: scale(0.99);
            }

            .primary-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                box-shadow: none;
            }

            .footnote {
                margin-top: 0.75rem;
                font-size: 0.7rem;
                line-height: 1.6;
                text-align: center;
                color: hsl(var(--muted-foreground));
            }

            .chat {
                display: flex;
                flex-direction: column;
                height: 100dvh;
            }

            .chat-head {
                flex: 0 0 auto;
                border-bottom: 1px solid hsl(var(--border));
                background: hsl(var(--card) / 0.75);
                padding: 0.75rem 1rem;
                backdrop-filter: blur(12px);
            }

            .chat-inner {
                width: 100%;
                max-width: 42rem;
                margin: 0 auto;
            }

            .chat-head .chat-inner {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding-right: 3rem;
            }

            .chat-avatar {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                width: 2.75rem;
                height: 2.75rem;
                flex: 0 0 auto;
                overflow: hidden;
                padding-top: 0.25rem;
                border-radius: 1rem;
                background: hsl(var(--accent));
            }

            .chat-avatar .avatar {
                animation: none;
            }

            .chat-id {
                min-width: 0;
                flex: 1 1 auto;
            }

            .chat-name {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 0.95rem;
                font-weight: 600;
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .chat-situation {
                font-size: 0.75rem;
                color: hsl(var(--muted-foreground));
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .badge {
                flex: 0 0 auto;
                padding: 0.375rem 0.75rem;
                border-radius: 999px;
                border: 1px solid hsl(var(--primary) / 0.25);
                background: hsl(var(--primary) / 0.1);
                font-size: 0.6875rem;
                font-weight: 600;
                color: hsl(var(--primary));
                white-space: nowrap;
            }

            .chat-body {
                flex: 1 1 auto;
                overflow-y: auto;
                padding: 1.25rem 1rem;
            }

            #message-list {
                display: flex;
                flex-direction: column;
                gap: 0.875rem;
            }

            .msg {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                max-width: 100%;
            }

            .msg--user {
                align-items: flex-end;
            }

            .msg--char {
                align-items: flex-start;
            }

            .msg-label {
                padding-left: 0.25rem;
                font-size: 0.6875rem;
                font-weight: 500;
                color: hsl(var(--muted-foreground));
            }

            .bubble {
                max-width: 82%;
                padding: 0.625rem 1rem;
                border-radius: var(--radius);
                font-size: 0.9375rem;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
                animation: pop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .msg--user .bubble {
                background: hsl(var(--primary));
                color: hsl(var(--primary-foreground));
                border-bottom-right-radius: 0.4rem;
            }

            .msg--char .bubble {
                border: 1px solid hsl(var(--border));
                border-bottom-left-radius: 0.4rem;
                background: hsl(var(--card));
            }

            .empty-state {
                margin-top: 1rem;
                padding: 1.5rem;
                border: 1px dashed hsl(var(--primary) / 0.25);
                border-radius: 1.5rem;
                background: hsl(var(--card) / 0.6);
                text-align: center;
            }

            .empty-state h3 {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 1rem;
                font-weight: 600;
            }

            .empty-state p {
                margin: 0.375rem auto 0;
                max-width: 22rem;
                font-size: 0.875rem;
                line-height: 1.6;
                color: hsl(var(--muted-foreground));
            }

            .examples {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                margin-top: 1rem;
            }

            .example {
                padding: 0.625rem 0.875rem;
                border: 1px solid hsl(var(--border));
                border-radius: 1rem;
                background: hsl(var(--background) / 0.7);
                font-size: 0.8125rem;
                text-align: left;
                color: hsl(var(--muted-foreground));
                transition:
                    border-color 0.18s,
                    color 0.18s;
            }

            .example:hover {
                border-color: hsl(var(--primary) / 0.35);
                color: hsl(var(--foreground));
            }

            .thinking {
                display: flex;
                align-items: center;
                gap: 0.375rem;
                align-self: flex-start;
                padding: 0.75rem 1rem;
                border: 1px solid hsl(var(--border));
                border-radius: var(--radius);
                border-bottom-left-radius: 0.4rem;
                background: hsl(var(--card));
            }

            .thinking span {
                width: 0.375rem;
                height: 0.375rem;
                border-radius: 999px;
                background: hsl(var(--muted-foreground) / 0.7);
                animation: bounce 1s infinite;
            }

            .thinking span:nth-child(2) {
                animation-delay: 0.12s;
            }

            .thinking span:nth-child(3) {
                animation-delay: 0.24s;
            }

            .chat-foot {
                flex: 0 0 auto;
                border-top: 1px solid hsl(var(--border));
                background: hsl(var(--card) / 0.85);
                padding: 0.75rem 1rem max(1rem, env(safe-area-inset-bottom));
                backdrop-filter: blur(12px);
            }

            .tip {
                display: flex;
                align-items: flex-start;
                gap: 0.625rem;
                margin-bottom: 0.5rem;
                padding: 0.75rem 0.875rem;
                border: 1px solid hsl(var(--primary) / 0.25);
                border-radius: 1rem;
                background: hsl(var(--accent));
                animation: pop 0.24s ease-out;
            }

            .tip p {
                flex: 1 1 auto;
                font-size: 0.8125rem;
                line-height: 1.6;
                color: hsl(var(--accent-foreground));
            }

            .tip > svg {
                flex: 0 0 auto;
                margin-top: 0.125rem;
                color: hsl(var(--primary));
            }

            .tip-close {
                display: grid;
                place-items: center;
                color: hsl(var(--muted-foreground));
            }

            .tip-btn {
                margin-bottom: 0.5rem;
                padding: 0.375rem 0.75rem;
                border-radius: 999px;
                border: 1px solid hsl(var(--primary) / 0.25);
                background: hsl(var(--primary) / 0.1);
                font-size: 0.75rem;
                font-weight: 600;
                color: hsl(var(--primary));
                transition:
                    background 0.18s,
                    transform 0.12s;
            }

            .tip-btn:hover {
                background: hsl(var(--primary) / 0.16);
            }

            .tip-btn:active {
                transform: scale(0.95);
            }

            .composer {
                display: flex;
                align-items: flex-end;
                gap: 0.5rem;
                padding: 0.375rem;
                border: 1px solid hsl(var(--border));
                border-radius: var(--radius);
                background: hsl(var(--background));
                transition: border-color 0.18s;
            }

            .composer:focus-within {
                border-color: hsl(var(--primary) / 0.45);
            }

            .composer input {
                flex: 1 1 auto;
                height: 2.75rem;
                padding: 0 0.75rem;
                border: 0;
                background: transparent;
                font-size: 0.9375rem;
                outline: none;
            }

            .composer input:disabled {
                opacity: 0.6;
            }

            .send {
                display: grid;
                place-items: center;
                width: 2.75rem;
                height: 2.75rem;
                flex: 0 0 auto;
                border-radius: 1rem;
                background: hsl(var(--primary));
                color: hsl(var(--primary-foreground));
                transition:
                    opacity 0.18s,
                    transform 0.12s;
            }

            .send:disabled {
                opacity: 0.4;
            }

            .send:active:not(:disabled) {
                transform: scale(0.95);
            }

            .chat-note {
                margin-top: 0.5rem;
                font-size: 0.6875rem;
                text-align: center;
                color: hsl(var(--muted-foreground));
            }

            .pill {
                display: inline-flex;
                align-items: center;
                gap: 0.375rem;
                padding: 0.375rem 0.75rem;
                border-radius: 999px;
                border: 1px solid hsl(var(--primary) / 0.25);
                background: hsl(var(--primary) / 0.1);
                font-size: 0.6875rem;
                font-weight: 600;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: hsl(var(--primary));
            }

            .cool-title {
                margin-top: 1rem;
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 1.625rem;
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.02em;
            }

            @media (min-width: 640px) {
                .cool-title {
                    font-size: 1.875rem;
                }
            }

            .cool-card {
                text-align: center;
            }

            .cool-card > * + * {
                margin-top: 0.75rem;
            }

            .label {
                font-size: 0.6875rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: hsl(var(--muted-foreground));
            }

            .clock {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 0.375rem;
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-variant-numeric: tabular-nums;
            }

            .clock span {
                font-size: 2.75rem;
                font-weight: 600;
                line-height: 1;
                letter-spacing: -0.02em;
            }

            @media (min-width: 640px) {
                .clock span {
                    font-size: 3.5rem;
                }
            }

            .clock em {
                font-style: normal;
                font-size: 1.75rem;
                color: hsl(var(--muted-foreground) / 0.6);
            }

            .card-title {
                font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
                font-size: 0.95rem;
                font-weight: 600;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .row svg {
                color: hsl(var(--primary));
            }

            .steps {
                list-style: none;
                margin-top: 0.75rem;
            }

            .steps li {
                display: flex;
                gap: 0.625rem;
                font-size: 0.8125rem;
                line-height: 1.6;
                color: hsl(var(--muted-foreground));
            }

            .steps li + li {
                margin-top: 0.625rem;
            }

            .steps li::before {
                content: "";
                flex: 0 0 auto;
                width: 0.375rem;
                height: 0.375rem;
                margin-top: 0.5rem;
                border-radius: 999px;
                background: hsl(var(--primary) / 0.6);
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-6px);
                }
            }

            @keyframes breathe {
                0%,
                100% {
                    opacity: 0.55;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.9;
                    transform: scale(1.06);
                }
            }

            @keyframes bounce {
                0%,
                80%,
                100% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                40% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            @keyframes pop {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

                        if (FLAVOR[traits[j]]) {
                            flavorTrait = traits[j];
                            break;
                        }
                    }
                    var flavor = flavorTrait && seed % 3 === 0 ? pick(FLAVOR[flavorTrait], seed) + " " : "";

                    var pool = POOLS.default;
                    if (/hülye|buta|csúnya|kuss|fasz|hulye/.test(text)) pool = POOLS.rude;
                    else if (text.indexOf("?") !== -1) pool = POOLS.question;
                    else if (/szép|szep|cuki|aranyos|tetszik|gyönyörű|gyonyoru/.test(text)) pool = POOLS.compliment;
                    else if (text.trim().length < 12) pool = POOLS.short;
                    if (attempt >= 4 && pool === POOLS.default) pool = POOLS.warm;

                    return flavor + pick(pool, seed);
                }

                var ICON = {
                    heart: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>',

                    lock: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
                    arrow: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
                    arrowRight:

                    bulb: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/></svg>',
                    close: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
                    sun: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

                };

                function applyTheme() {
                    var saved = read(KEY_THEME);
                    var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                    var theme = saved || (system ? "dark" : "light");
                    document.documentElement.setAttribute("data-theme", theme);
                    byId("theme-toggle").innerHTML = theme === "dark" ? ICON.sun : ICON.moon;
                }

                function toggleTheme() {
                    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", next);
                    write(KEY_THEME, next);
                    byId("theme-toggle").innerHTML = next === "dark" ? ICON.sun : ICON.moon;
                }

                function profileFromSetup() {
                    var s = state.setup;
                    var customSituation = s.customSituation.trim().slice(0, 60);
                    return {
                        gender: s.gender,
                        name: s.name.trim().slice(0, 24),
                        age: Number(s.age) || 17,
                        traits: s.traits.slice(),
                        situation: s.customSituationOpen && customSituation ? customSituation : s.situation,
                        customStyle: s.customStyleOpen ? s.customStyle.trim().slice(0, 160) : "",
                    };
                }

                function canStart() {
                    return !state.setup.customSituationOpen || state.setup.customSituation.trim().length > 0;
                }

                function chip(label, attrs, active) {
                    return (
                        '<button type="button" class="chip' +
                        (active ? " chip--on" : "") +
                        '" ' +
                        attrs +
                        ">" +
                        label +
                        "</button>"
                    );

                function egoChip(id, active, label) {

                        '<button type="button" class="chip' +

                    );

                function setupHtml() {
                    var s = state.setup;
                    var profile = profileFromSetup();
                    var genderChips = GENDERS.map(function (option) {

                    }).join("");

                        return chip(esc(trait), 'data-trait="' + esc(trait) + '"', s.traits.indexOf(trait) !== -1);
                    }).join("");
                    var situationChips = SITUATIONS.map(function (option) {
                        return chip(
                            esc(option),

                        );
                    }).join("");

                    var styleField = s.customStyleOpen
                        ? '<div class="custom-field"><textarea id="custom-style" maxlength="160" placeholder="pl. visszahúzódó, de imád sorozatokat idézni és feltűnően sokat mosolyog">' +
                          esc(s.customStyle) +
                          '</textarea><div class="custom-meta"><p>Írd le a saját szavaiddal: a hangnemhez és a figurához is igazodunk.</p><span id="style-count">' +
                          s.customStyle.length +
                          "/160</span></div></div>"
                        : '<p class="hint-line">A figura ezekből épül fel: fülhallgató, könyv, labda vagy épp sapka.</p>';

                    var situationField = s.customSituationOpen
                        ? '<div class="custom-field"><input type="text" id="custom-situation" maxlength="60" value="' +
                          esc(s.customSituation) +
                          '" placeholder="pl. a buszmegállóban, szakad az eső, késik a busz" /><div class="custom-meta"><p>A saját helyzeted: erre reagál a partner.</p><span id="situation-count">' +
                          s.customSituation.length +
                          "/60</span></div></div>"
                        : "";

                    return [
                        '<div class="wrap">',
                        '<div class="brand"><div class="brand-badge">' +
                            ICON.heart +
                            '</div><div><p class="brand-title">Ismerkedési Tréner</p><p class="brand-sub">Tét nélküli gyakorlótér</p></div></div>',
                        '<div class="avatar-stage"><div class="avatar-glow"></div><div id="avatar-preview">' +

                        '<h1 class="title">Kit szeretnél megszólítani?</h1>',
                        '<p class="lead">Add meg pár részletet, és összeállítjuk a gyakorlópartnert. Itt nem lehet igazi kudarc – csak gyakorlás. 14–25 éveseknek.</p>',
                        '<div class="skills"><div class="skill">Megszólítás</div><div class="skill">Beszélgetés</div><div class="skill">Önbizalom</div></div>',
                        '<div class="card">',
                        '<div><div class="field-label"><p>Ki ő?</p></div><div class="chips">' +
                            genderChips +
                            "</div></div>",
                        '<div class="grid-2"><div><div class="field-label"><p>Neve</p><p class="field-hint">nem kötelező</p></div><input type="text" id="partner-name" maxlength="24" value="' +
                            esc(s.name) +
                            '" placeholder="pl. Anna" /></div><div><div class="field-label"><p>Kora</p><p class="field-hint">14–25</p></div><input type="text" id="partner-age" inputmode="numeric" maxlength="2" value="' +
                            esc(s.age) +
                            '" /></div></div>',
                        '<div><div class="field-label"><p>Stílusa, jellemzői</p><p class="field-hint">max. 4</p></div><div class="chips">' +
                            traitChips +
                            egoChip("toggle-style", s.customStyleOpen, "Egyéni") +
                            "</div>" +
                            styleField +
                            "</div>",
                        '<div><div class="field-label"><p>Helyzet</p></div><div class="chips">' +
                            situationChips +
                            egoChip("toggle-situation", s.customSituationOpen, "Egyéni helyzet") +
                            "</div>" +
                            situationField +
                            "</div>",
                        '<button type="button" class="primary-btn" id="start-btn"' +
                            (canStart() ? "" : " disabled") +
                            ">Edzés indítása" +
                            ICON.arrowRight +
                            "</button>",
                        '<p class="footnote">5 próbálkozás. Utána 24 óra szünet. Nincs tét, nincs következmény.</p>',
                        "</div>",
                        '<p class="footnote">Önálló verzió · a partner válaszai szimuláltak, internet nélkül is működik.</p>',

                }

                function updateAvatarPreview() {
                    var host = byId("avatar-preview");
                    if (host) host.innerHTML = avatarSvg(profileFromSetup(), 172);
                }

                function showSetup() {
                    state.screen = "setup";
                    if (state.tick) {
                        clearInterval(state.tick);
                        state.tick = null;
                    }
                    byId("app").innerHTML = setupHtml();
                    wireSetup();
                }

                function wireSetup() {
                    var s = state.setup;

                    qsa("[data-gender]").forEach(function (button) {
                        button.addEventListener("click", function () {
                            s.gender = button.getAttribute("data-gender");
                            showSetup();
                        });
                    });

                    qsa("[data-trait]").forEach(function (button) {
                        button.addEventListener("click", function () {
                            var trait = button.getAttribute("data-trait");
                            var index = s.traits.indexOf(trait);
                            if (index !== -1) s.traits.splice(index, 1);
                            else if (s.traits.length < 4) s.traits.push(trait);
                            showSetup();
                        });
                    });

                    var nameInput = byId("partner-name");
                    nameInput.addEventListener("input", function () {
                        var value = nameInput.value.slice(0, 24);
                        if (value !== nameInput.value) nameInput.value = value;
                        s.name = value;
                    });

                    var ageInput = byId("partner-age");
                    ageInput.addEventListener("input", function () {
                        var value = ageInput.value.replace(/[^0-9]/g, "").slice(0, 2);
                        if (value !== ageInput.value) ageInput.value = value;
                        s.age = value;
                    });
                    ageInput.addEventListener("blur", function () {
                        var clamped = String(Math.min(25, Math.max(14, Number(ageInput.value) || 17)));
                        ageInput.value = clamped;
                        s.age = clamped;
                    });

                    byId("toggle-style").addEventListener("click", function () {
                        s.customStyleOpen = !s.customStyleOpen;
                        showSetup();
                        var field = byId("custom-style");
                        if (field) field.focus();
                    });

                    var styleField = byId("custom-style");
                    if (styleField) {
                        styleField.addEventListener("input", function () {
                            var value = styleField.value.slice(0, 160);
                            if (value !== styleField.value) styleField.value = value;
                            s.customStyle = value;
                            byId("style-count").textContent = value.length + "/160";
                            updateAvatarPreview();
                        });
                    }

                    byId("toggle-situation").addEventListener("click", function () {
                        s.customSituationOpen = !s.customSituationOpen;
                        showSetup();
                        var field = byId("custom-situation");
                        if (field) field.focus();
                    });

                    qsa("[data-situation]").forEach(function (button) {
                        button.addEventListener("click", function () {
                            s.situation = button.getAttribute("data-situation");
                            s.customSituationOpen = false;
                            showSetup();
                        });
                    });

                    var situationField = byId("custom-situation");
                    if (situationField) {
                        situationField.addEventListener("input", function () {
                            var value = situationField.value.slice(0, 60);
                            if (value !== situationField.value) situationField.value = value;
                            s.customSituation = value;
                            byId("situation-count").textContent = value.length + "/60";
                            byId("start-btn").disabled = !canStart();
                        });
                    }

                    byId("start-btn").addEventListener("click", function () {
                        if (canStart()) startTraining();
                    });
                }

                function displayName(profile) {
                    if (profile.name) return profile.name;
                    return profile.gender === "lany" ? "Lány" : "Fiú";
                }

                function chatShellHtml() {
                    var profile = state.profile;
                    return [
                        '<div class="chat">',
                        '<header class="chat-head"><div class="chat-inner"><div class="chat-avatar">' +
                            avatarSvg(profile, 34) +
                            '</div><div class="chat-id"><p class="chat-name">' +
                            esc(displayName(profile)) +
                            (profile.age ? ", " + esc(profile.age) : "") +
                            '</p><p class="chat-situation">' +
                            esc(profile.situation) +
                            '</p></div><div class="badge" id="attempt-badge"></div></div></header>',
                        '<div class="chat-body" id="messages"><div class="chat-inner" id="message-list"></div></div>',
                        '<div class="chat-foot"><div class="chat-inner"><div id="tip-slot"></div><button type="button" class="tip-btn" id="tip-btn">✦ Wingman tipp</button><form class="composer" id="composer"><input type="text" id="draft" maxlength="500" placeholder="Írj neki valamit…" autocomplete="off" /><button type="submit" class="send" id="send-btn" aria-label="Üzenet küldése">' +
                            ICON.arrow +
                            '</button></form><p class="chat-note" id="chat-note"></p></div></div>',
                        "</div>",
                    ].join("");
                }

                function showChat() {
                    state.screen = "chat";
                    if (state.tick) {
                        clearInterval(state.tick);
                        state.tick = null;
                    }
                    byId("app").innerHTML = chatShellHtml();

                    if (state.messages.length === 0) {
                        var examples = OPENING_EXAMPLES.map(function (example) {
                            return (
                                '<button type="button" class="example" data-example="' +
                                esc(example) +
                                '">' +
                                esc(example) +
                                "</button>"
                            );
                        }).join("");
                        byId("message-list").insertAdjacentHTML(
                            "beforeend",
                            '<div class="empty-state" id="empty-state"><h3>Nincs még üzenet.</h3><p>Nem kell tökéletes nyitómondat. Elég egy egyszerű szia – utána már megy magától.</p><div class="examples">' +
                                examples +
                                "</div></div>"
                        );
                        qsa("[data-example]").forEach(function (button) {
                            button.addEventListener("click", function () {
                                var input = byId("draft");
                                input.value = button.getAttribute("data-example");
                                input.focus();
                                byId("send-btn").disabled = false;
                            });
                        });
                    } else {
                        state.messages.forEach(appendMessage);
                    }

                    byId("composer").addEventListener("submit", function (event) {
                        event.preventDefault();
                        var input = byId("draft");
                        var text = input.value.trim();
                        if (!text || state.thinking || state.attempts >= MAX_ATTEMPTS) return;
                        input.value = "";
                        send(text);
                    });

                    byId("draft").addEventListener("input", function () {
                        var input = byId("draft");
                        byId("send-btn").disabled =
                            !input.value.trim() || state.thinking || state.attempts >= MAX_ATTEMPTS;
                    });

                    byId("tip-btn").addEventListener("click", function () {
                        showTip(null);
                    });

                    if (state.tip) showTip(state.tip);
                    updateChatMeta();
                    scrollToEnd(false);
                }

                function renderTip(tip) {
                    state.tip = tip;
                    byId("tip-slot").innerHTML =
                        '<div class="tip">' +
                        ICON.bulb +
                        "<p>" +
                        esc(tip) +
                        '</p><button type="button" class="tip-close" aria-label="Tipp bezárása" id="tip-close">' +
                        ICON.close +
                        "</button></div>";
                    byId("tip-close").addEventListener("click", function () {
                        state.tip = null;
                        byId("tip-slot").innerHTML = "";
                    });
                }

                function fallbackTip() {
                    var tip = WINGMAN_TIPS[Math.floor(Math.random() * WINGMAN_TIPS.length)];
                    if (tip === state.tip) tip = WINGMAN_TIPS[(WINGMAN_TIPS.indexOf(tip) + 1) % WINGMAN_TIPS.length];
                    return tip;
                }

                var tipRequestId = 0;
                function showTip(forced) {
                    if (forced) return renderTip(forced);
                    if (!AI_ENABLED) return renderTip(fallbackTip());

                    var myId = ++tipRequestId;
                    byId("tip-slot").innerHTML =
                        '<div class="tip">' + ICON.bulb + "<p>Gondolkodom egy jó tippen…</p></div>";
                    geminiTip(state.profile, state.messages)
                        .catch(function (err) {
                            console.warn("[Gemini] tipp hiba, tartalék tipp:", err);
                            return fallbackTip();
                        })
                        .then(function (tip) {
                            if (myId !== tipRequestId || !byId("tip-slot")) return;
                            renderTip(tip.replace(/\*/g, "").trim());
                        });
                }

                function appendMessage(message) {
                    var empty = byId("empty-state");
                    if (empty) empty.remove();

                    var isUser = message.role === "user";
                    var wrap = document.createElement("div");
                    wrap.className = "msg " + (isUser ? "msg--user" : "msg--char");
                    wrap.innerHTML =
                        (isUser ? "" : '<p class="msg-label">' + esc(displayName(state.profile)) + "</p>") +
                        '<div class="bubble">' +
                        esc(message.text) +
                        "</div>";

                    byId("message-list").appendChild(wrap);
                    scrollToEnd(true);
                }

                function scrollToEnd(smooth) {
                    var body = byId("messages");
                    if (body) body.scrollTo({ top: body.scrollHeight, behavior: smooth ? "smooth" : "auto" });
                }

                function loadFeedback() {
                    if (state.feedback) {
                        byId("feedback-body").innerHTML = feedbackHtml(state.feedback);
                        return;
                    }
                    if (state.feedbackLoading) return;
                    state.feedbackLoading = true;
                    var done = function (fb) {
                        state.feedbackLoading = false;
                        state.feedback = fb;
                        write(KEY_FEEDBACK, JSON.stringify(fb));
                        var body = byId("feedback-body");
                        if (body) {
                            body.innerHTML = feedbackHtml(fb);
                            scrollToEnd(true);
                        }
                    };
                    var request = AI_ENABLED
                        ? geminiFeedback(state.profile, state.messages)
                        : Promise.reject(new Error("nincs kulcs"));
                    request.then(done, function (err) {
                        console.warn("[Gemini] visszajelzés hiba, tartalék:", err);
                        done(FALLBACK_FEEDBACK);
                    });
                }

                function updateChatMeta() {
                    var closed = state.attempts >= MAX_ATTEMPTS;
                    byId("attempt-badge").textContent = "Próbálkozás: " + state.attempts + " / " + MAX_ATTEMPTS;
                    byId("chat-note").textContent = closed
                        ? "Elérted az 5 próbálkozást."
                        : "Minden üzenet egy próbálkozás · " + (MAX_ATTEMPTS - state.attempts) + " van hátra";

                    var input = byId("draft");
                    input.disabled = closed || state.thinking;
                    input.placeholder = closed ? "Az edzés lezárult." : "Írj neki valamit…";
                    byId("send-btn").disabled = closed || state.thinking || !input.value.trim();

                    if (closed && !state.thinking && !byId("end-bar")) {
                        byId("tip-slot").innerHTML = "";
                        byId("tip-btn").style.display = "none";
                        byId("composer").style.display = "none";
                        byId("chat-note").insertAdjacentHTML(
                            "beforebegin",
                            '<div id="end-bar" style="display:grid;gap:10px;margin:8px 0"><p style="margin:0;text-align:center">Vége a beszélgetésnek. Olvasd át nyugodtan, és ha kész vagy, lépj tovább.</p><div class="card" id="feedback-box"><div class="row">' +
                                ICON.sparkles +
                                '<p class="card-title">Ami jól ment</p></div><div id="feedback-body"><p>Készül a visszajelzés…</p></div></div><button type="button" class="primary-btn" id="end-btn">Befejezés</button></div>'
                        );
                        byId("end-btn").addEventListener("click", finish);
                        loadFeedback();
                        scrollToEnd(true);
                    }
                }

                function startTraining() {
                    state.profile = profileFromSetup();
                    state.messages = [];
                    state.attempts = 0;
                    state.thinking = false;
                    state.tip = null;
                    state.feedback = null;
                    state.feedbackLoading = false;
                    remove(KEY_FEEDBACK);
                    saveSession();
                    showChat();
                }

                function send(text) {
                    if (state.thinking || state.attempts >= MAX_ATTEMPTS) return;
                    var attempt = state.attempts + 1;

                    state.messages.push({ role: "user", text: text });
                    state.attempts = attempt;
                    saveSession();
                    appendMessage({ role: "user", text: text });

                    state.thinking = true;
                    var thinking = document.createElement("div");
                    thinking.className = "thinking";
                    thinking.id = "thinking";
                    thinking.innerHTML = "<span></span><span></span><span></span>";
                    byId("message-list").appendChild(thinking);
                    scrollToEnd(true);
                    updateChatMeta();

                    var started = Date.now();
                    var replyPromise = AI_ENABLED
                        ? geminiReply(state.profile, state.messages, attempt).catch(function (err) {
                              console.warn("Gemini hiba, tartalék válasz:", err);
                              return mockReply(state.profile, state.messages, attempt);
                          })
                        : Promise.resolve(mockReply(state.profile, state.messages, attempt));

                    replyPromise
                        .catch(function (err) {
                            console.error("[Gemini] végső hiba:", err);
                            return mockReply(state.profile, state.messages, attempt);
                        })
                        .then(function (reply) {
                            var wait = Math.max(0, 650 - (Date.now() - started));
                            window.setTimeout(function () {
                                state.thinking = false;
                                var indicator = byId("thinking");
                                if (indicator) indicator.remove();

                                state.messages.push({ role: "character", text: reply });
                                saveSession();
                                appendMessage({ role: "character", text: reply });
                                updateChatMeta();
                            }, wait);
                        });
                }

                function finish() {
                    var until = Date.now() + COOLDOWN_MS;
                    write(KEY_COOLDOWN, String(until));
                    write(KEY_LAST_PROFILE, JSON.stringify(state.profile));
                    if (!readJSON(KEY_FEEDBACK))
                        write(KEY_FEEDBACK, JSON.stringify(state.feedback || FALLBACK_FEEDBACK));
                    remove(KEY_SESSION);

                    state.cooldownUntil = until;
                    state.lastProfile = state.profile;
                    state.messages = [];
                    state.attempts = 0;
                    state.thinking = false;
                    state.tip = null;
                    showCooldown();
                }

                function showCooldown() {
                    state.screen = "cooldown";
                    var profile = state.lastProfile || state.profile || { gender: "lany", traits: [] };
                    var steps = BRAVE_STEPS.map(function (step) {
                        return "<li>" + esc(step) + "</li>";
                    }).join("");

                    var savedFeedback = readJSON(KEY_FEEDBACK);
                    byId("app").innerHTML = [
                        '<div class="wrap">',
                        '<div class="avatar-stage"><div class="avatar-glow"></div>' +
                            avatarSvg(profile, 120) +
                            "</div>",
                        '<div class="center"><span class="pill">' +
                            ICON.lock +
                            'Szünet</span><h2 class="cool-title">A szimuláció véget ért.<br />Most te jösz a valóságban!</h2><p class="lead">Nem kell tökéletesnek lenned. Elég, ha kedvesen odaköszönsz valakinek.</p></div>',
                        '<div class="card cool-card"><p class="label">Hátralévő idő</p><div class="clock" id="clock"></div><p class="chat-note" id="cool-hint"></p><div id="cool-action"></div></div>',
                        savedFeedback
                            ? '<div class="card"><div class="row">' +
                              ICON.sparkles +
                              '<p class="card-title">Ami jól ment</p></div>' +
                              feedbackHtml(savedFeedback) +
                              "</div>"
                            : "",
                        '<div class="card"><div class="row">' +
                            ICON.sparkles +
                            '<p class="card-title">Mielőtt kimész</p></div><ul class="steps">' +
                            steps +
                            "</ul></div>",
                        '<p class="footnote">A számláló a böngészőben is eltárolódik – frissítéssel nem lehet megkerülni.</p>',
                        "</div>",
                    ].join("");

                    renderClock();
                    if (state.tick) clearInterval(state.tick);
                    state.tick = window.setInterval(renderClock, 1000);
                }

                function renderClock() {
                    var clock = byId("clock");
                    if (!clock) return;

                    var remaining = Math.max(0, state.cooldownUntil - Date.now());
                    clock.innerHTML =
                        "<span>" +
                        pad(Math.floor(remaining / 3600000)) +
                        "</span><em>:</em><span>" +
                        pad(Math.floor((remaining % 3600000) / 60000)) +
                        "</span><em>:</em><span>" +
                        pad(Math.floor((remaining % 60000) / 1000)) +
                        "</span>";

                    if (remaining <= 0) {
                        if (state.tick) {
                            clearInterval(state.tick);
                            state.tick = null;
                        }
                        byId("cool-hint").textContent = "Letelt a 24 óra.";
                        if (!byId("restart-btn")) {
                            byId("cool-action").innerHTML =
                                '<p class="card-title" style="margin:10px 0">Hogy ment a valóságban?</p>' +
                                '<div style="display:grid;gap:10px">' +
                                '<button type="button" class="primary-btn" id="success-btn">Sikerült beszélnem valakivel</button>' +
                                '<button type="button" class="primary-btn" id="restart-btn">Még nem, új edzést indítok</button>' +
                                '</div><div id="support-slot"></div>';
                            byId("success-btn").addEventListener("click", function () {
                                byId("support-slot").innerHTML =
                                    '<div class="card" style="margin-top:12px"><p class="card-title">Ez szuper, büszke lehetsz magadra!</p>' +
                                    "<p>Ha az app segített, és szeretnéd, köszönetként támogathatod a fejlesztését. Ez teljesen önkéntes, és csak akkor, ha van rá lehetőséged (fiatalabbaknál szülői engedéllyel).</p>" +
                                    '<a class="primary-btn" href="' +
                                    esc(SUPPORT_URL) +
                                    '" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Támogatom a fejlesztést</a></div>';
                            });
                            byId("restart-btn").addEventListener("click", function () {
                                state.cooldownUntil = 0;
                                state.profile = null;
                                state.lastProfile = null;
                                showSetup();
                            });
                        }
                    } else {
                        byId("cool-hint").textContent = "Az edzés zárolva a visszaszámláló végéig.";
                    }
                }

                applyTheme();
                byId("theme-toggle").addEventListener("click", toggleTheme);

                (function boot() {
                    var until = readCooldown();
                    if (until > Date.now()) {
                        state.cooldownUntil = until;
                        state.lastProfile = readJSON(KEY_LAST_PROFILE);
                        showCooldown();
                        return;
                    }

                    var session = readJSON(KEY_SESSION);
                    if (session && session.profile && session.profile.gender) {
                        state.profile = session.profile;
                        state.messages = Array.isArray(session.messages) ? session.messages : [];
                        state.attempts = Number(session.attempts) || 0;
                        state.feedback = readJSON(KEY_FEEDBACK);
                        showChat();
                        return;
                    }

                    showSetup();
                })();
            })();
        </script>
    </body>
</html>
